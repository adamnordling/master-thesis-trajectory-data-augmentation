[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-augmentation"
version = "1.0.0"
description = "Automated pipeline for generating and evaluating augmented trajectory data."
readme = "README.md"
requires-python = "~=3.11"
authors = [
    { name = "Adam Nordling" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]

# 1. MAIN RUNTIME DEPENDENCIES
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "optuna>=3.4.0,<4.0.0",
    "pandas>=2.1.0,<3.0.0",
    "pyarrow>=14.0.0,<16.0.0",
    "scikit-learn>=1.3.0,<1.5.0",
    "scipy>=1.11.0,<2.0.0",
    "numba>=0.58.1,<0.60.0",
    "xgboost>=2.0.0,<3.0.0",
    "pyproj>=3.6.0,<4.0.0",
    "colorama>=0.4.6,<1.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "psutil>=5.9.0,<6.0.0",
    "pyyaml>=6.0,<7.0",
    "seaborn>=0.13.0,<0.14.0",
    "tqdm>=4.66.0,<5.0.0",
]

# 2. DEVELOPMENT DEPENDENCIES
[project.optional-dependencies]
dev = [
    "ruff~=0.3.0",
    "mypy~=1.9.0",
    "pytest~=8.0.0",
    "pip-tools~=7.4.0",
    "pandas-stubs~=2.1.0",
    "deptry~=0.14.0",
    "jupyter~=1.0.0",
    "ipykernel~=6.29.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# RUFF CONFIGURATION
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Select rules:
# E/F (Error/Flake8), I (Isort), N (Naming), UP (Upgrade), D (Docstrings), ANN (Annotations), PT (Pytest)
select = ["E", "F", "I", "N", "UP", "D", "ANN", "PT"]

# IGNORE these specific rules:
ignore = [
    "D100", "D104", "ANN101", "ANN102",
    "N806",    # Allow uppercase X_train (Standard in ML)
    "N803",    # Allow uppercase X in function arguments
    "D205",    # Don't force a blank line in docstrings
    "D200",    # Don't force docstrings to be on one line
    "ANN401",  # Allow Any type hints
    "E501",    # Don't error on long lines (we'll let the formatter handle it)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# MYPY CONFIGURATION
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

# DEPTRY CONFIGURATION
[tool.deptry.per_rule_ignores]
DEP002 = ["pyarrow", "ruff", "mypy", "pytest", "pip-tools", "pandas-stubs", "deptry", "jupyter", "ipykernel"]