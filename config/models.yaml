# Used in: src/evaluation/models.py (get_model_definitions)

models:
  RandomForest:
    n_estimators: [100, 300, 500]
    max_depth: [10, 20, 40, null]
    min_samples_leaf: [1, 2, 5]
    max_features: ['sqrt', 'log2']
    criterion: ['gini', 'entropy']
    n_jobs: [1]

  XGBoost:
    n_estimators: [100, 300, 500]
    max_depth: [3, 5, 8]
    learning_rate: [0.02, 0.05, 0.1, 0.2]
    subsample: [0.8, 1.0]
    colsample_bytree: [0.8, 1.0]
    gamma: [0, 0.1, 0.5]
    n_jobs: [1]
    tree_method: ['hist']

  MLP:
    hidden_layer_sizes:
      - [50, 50]
      - [100]
      - [200]
      - [100, 50]
      - [100, 100]
      - [100, 50, 50]
      - [100, 100, 50]
      - [100, 100, 100]
    alpha: [0.0001, 0.001, 0.01]
    activation: ['relu', 'tanh']
    learning_rate_init: [0.001, 0.01]

  LogisticRegression:
    C: [0.01, 0.1, 1.0, 10.0, 100.0]
    penalty: ['l1', 'l2']
    solver: ['saga']
    n_jobs: [1]